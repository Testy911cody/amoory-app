<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E8C8C">
<meta name="description" content="Talk Board — a picture-and-voice communication app for nonspeaking children. Any language, community voices.">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Talk Board">
<title>Talk Board</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="topbar">
    <div class="title" id="appTitle">Talk Board</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="contributeBtn" title="Suggest a word">➕</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>

  <div class="localebar">
    <label for="localeSelect"><span data-i18n="language">Language</span></label>
    <select id="localeSelect" aria-label="Choose language"></select>
    <label for="dialectSelect"><span data-i18n="dialect">Dialect</span></label>
    <select id="dialectSelect" aria-label="Choose dialect"></select>
  </div>

  <div class="strip">
    <div class="strip-cards" id="strip"></div>
    <button class="strip-btn back" id="backBtn" aria-label="Remove last"><span class="ic">⌫</span></button>
    <button class="strip-btn clear" id="clearBtn" aria-label="Clear all"><span class="ic">🗑</span></button>
    <button class="strip-btn speak" id="speakBtn" aria-label="Say sentence"><span class="ic">🔊</span><span id="sayLbl">Say</span></button>
  </div>

  <div class="cats" id="cats"></div>
  <div class="board" id="board"></div>

  <!-- Settings panel -->
  <div class="panel" id="settingsPanel" hidden aria-hidden="true">
    <div class="panel-inner">
      <div class="panel-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="settingsClose" aria-label="Close">✕</button>
      </div>
      <div class="panel-body">
        <label class="field">
          <span>Voice</span>
          <div class="row">
            <select id="voiceSelect" aria-label="Choose voice"></select>
            <button type="button" class="btn-secondary" id="previewVoiceBtn">Preview</button>
          </div>
        </label>
        <label class="field check">
          <input type="checkbox" id="bilingualToggle">
          <span>Show second language on cards</span>
        </label>
        <label class="field">
          <span>Second language</span>
          <select id="secondaryLocaleSelect" aria-label="Second language"></select>
        </label>
        <hr>
        <h3>Pending submissions <small>(local review)</small></h3>
        <div id="pendingList"></div>
      </div>
    </div>
  </div>

  <!-- Contribute word panel -->
  <div class="panel" id="contributePanel" hidden aria-hidden="true">
    <div class="panel-inner">
      <div class="panel-head">
        <h2>Suggest a word</h2>
        <button class="icon-btn" id="contributeClose" aria-label="Close">✕</button>
      </div>
      <form class="panel-body" id="contribForm">
        <label class="field">
          <span>Word</span>
          <input type="text" id="contribText" required maxlength="80" placeholder="Type the word in your language">
        </label>
        <label class="field">
          <span>Category</span>
          <select id="contribCategory" required></select>
        </label>
        <label class="field">
          <span>Emoji (optional)</span>
          <input type="text" id="contribEmoji" maxlength="4" placeholder="💬">
        </label>
        <div class="field">
          <span>Record audio (optional)</span>
          <button type="button" class="btn-record" id="contribRecordBtn">🎤 Record</button>
        </div>
        <p class="muted">Submissions stay pending until approved. Approved words appear on the board for everyone using this device; online sharing comes in Phase 2.</p>
        <div class="panel-actions">
          <button type="button" class="btn-secondary" id="contributeClose2" onclick="document.getElementById('contributeClose').click()">Cancel</button>
          <button type="submit" class="btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
